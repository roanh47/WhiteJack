{% extends 'layout.html' %}
{% block body %}

<div class="welkomscherm" style="display:flex;flex-direction:column;align-items:center;margin-top:60px;">
  <h2 style="font-size:32px;margin-bottom:16px;">Welkom bij WhiteJack</h2>
  <p style="font-size:18px;margin-bottom:24px;max-width:480px;text-align:center;">
    Doel: kom zo dicht mogelijk bij 24 zonder erover te gaan. Je speelt maximaal 3 rondes tegen de Scar.
  </p>
  <form method="post" action="{{ url_for('Round1.start') }}" style="background:rgba(255,255,255,0.04);padding:24px 32px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,0.2);display:flex;flex-direction:column;align-items:center;gap:16px;">
    <label style="font-size:16px;">Inzet: €
      <input type="number" name="bet" value="1" min="1" style="padding:8px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;margin-left:8px;width:80px;">
    </label>
    <button type="submit" class="btn primary" style="font-size:18px;padding:12px 32px;border-radius:10px;">Rol de dice!</button>
  </form>
</div>

{% endblock %}
